<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股東會紀念品情報系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #global-tooltip {
            position: fixed; visibility: hidden; opacity: 0;
            background-color: #1e293b; color: #f8fafc; text-align: left;
            border-radius: 8px; padding: 12px 16px; z-index: 9999;
            pointer-events: none; transition: opacity 0.15s;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); border: 1px solid #334155;
            font-size: 13px; line-height: 1.6; max-width: 280px;
        }
        .bg-strict { background-color: #fca5a5 !important; }
        .bg-gift { background-color: #bbf7d0 !important; }
        .bg-danger { background-color: #fee2e2 !important; }
        .text-expired { color: #dc2626 !important; font-weight: 800; }
        
        th.sticky-header {
            position: sticky; top: 0; z-index: 20; background-color: #f1f5f9;
            box-shadow: 0 2px 4px -1px rgba(0,0,0,0.1);
        }
        .sortable { cursor: pointer; user-select: none; transition: background-color 0.2s; }
        .sortable:hover { background-color: #e2e8f0; }

        .sort-container {
            display: inline-flex; flex-direction: column; align-items: center;
            vertical-align: middle; margin-left: 4px; line-height: 1;
        }
        .tri-up {
            width: 0; height: 0;
            border-left: 4px solid transparent; border-right: 4px solid transparent;
            border-bottom: 5px solid #cbd5e1; margin-bottom: 2px;
        }
        .tri-down {
            width: 0; height: 0;
            border-left: 4px solid transparent; border-right: 4px solid transparent;
            border-top: 5px solid #cbd5e1;
        }
        .active-sort.sort-asc .tri-up { border-bottom-color: #3b82f6; }
        .active-sort.sort-desc .tri-down { border-top-color: #3b82f6; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

<nav class="bg-indigo-800 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-[98%] mx-auto px-4 py-2">
        <div class="flex flex-col md:flex-row items-center justify-between gap-3">
            <div class="flex w-full md:w-auto items-center justify-between md:justify-start space-x-4">
                <span class="text-lg md:text-xl font-bold tracking-widest whitespace-nowrap">股東會紀念品情報</span>
                <div class="flex space-x-2">
                    <button onclick="switchTab('current')" id="tab-current" class="px-4 py-1.5 rounded-md text-sm font-bold bg-indigo-900 shadow-inner ring-1 ring-indigo-400 whitespace-nowrap">當下會議</button>
                    <button onclick="switchTab('history')" id="tab-history" class="px-4 py-1.5 rounded-md text-sm font-medium hover:bg-indigo-600 transition whitespace-nowrap">歷史資料</button>
                </div>
            </div>
            <div class="w-full md:flex-1 md:max-w-xs">
                <input type="text" id="searchInput" oninput="renderData()" placeholder="🔍 輸入代號或名稱..." class="w-full px-3 py-1.5 bg-indigo-900 border border-indigo-600 text-white placeholder-indigo-300 rounded focus:outline-none focus:ring-2 focus:ring-white text-sm">
            </div>
        </div>
    </div>
</nav>

<main class="max-w-[98%] mx-auto py-6">
    <div id="page-current" class="block">
        <div class="overflow-x-auto bg-white rounded-lg shadow border border-slate-200 max-h-[80vh]">
            <table class="min-w-max md:min-w-full divide-y divide-slate-200 text-sm">
                <thead class="bg-slate-100 text-slate-700 font-bold">
                    <tr>
                        <th class="sticky-header px-3 py-3 text-left whitespace-nowrap sortable" onclick="setSort('stock_id')" onmouseenter="showTip(event, this)" onmousemove="moveTip(event)" onmouseleave="hideTip()" data-tip="<b>標籤說明</b><br><span class='text-green-600'>零</span>：僅零股寶有資料<br><span class='text-red-600'>公</span>：僅MOPS有正式公告">
                            代號 <div class="sort-container" id="icon-stock_id"><div class="tri-up"></div><div class="tri-down"></div></div>
                        </th>
                        <th class="sticky-header px-3 py-3 text-left whitespace-nowrap">名稱</th>
                        <th class="sticky-header px-3 py-3 text-left whitespace-nowrap sortable" onclick="setSort('price')">
                            股價 <div class="sort-container" id="icon-price"><div class="tri-up"></div><div class="tri-down"></div></div>
                        </th>
                        <th class="sticky-header px-3 py-3 text-left whitespace-nowrap sortable" onclick="setSort('last_buy')" onmouseenter="showTip(event, this)" onmousemove="moveTip(event)" onmouseleave="hideTip()" data-tip="<b>顏色說明</b><br><span class='bg-red-200 text-slate-800 px-1'>淺紅底</span>：缺少買進日資料<br><span class='text-red-500 font-bold'>紅字粗體</span>：已過最後買進日">
                            最後買進日 <div class="sort-container" id="icon-last_buy"><div class="tri-up"></div><div class="tri-down"></div></div>
                        </th>
                        <th class="sticky-header px-3 py-3 text-left whitespace-nowrap" onmouseenter="showTip(event, this)" onmousemove="moveTip(event)" onmouseleave="hideTip()" data-tip="<b>底色說明</b><br><span class='bg-red-300 text-slate-800 px-1'>紅底</span>：領取條件嚴格<br><span class='bg-green-200 text-slate-800 px-1'>綠底</span>：超商禮券類<br><br><b>文字說明</b><br>若出現「A / B」，代表 零股寶(A) 與 MOPS(B) 公告之物品不一致">紀念品</th>
                        <th class="sticky-header px-3 py-3 text-left whitespace-nowrap sortable" onclick="setSort('ir')" onmouseenter="showTip(event, this)" onmousemove="moveTip(event)" onmouseleave="hideTip()" data-tip="<b>近5年發放率</b><br><span class='bg-red-100 text-red-700 px-1 font-bold'>淺紅底</span>：≤ 40%<br><span class='text-red-700 font-bold'>深紅字</span>：≤ 60%">
                            近5年發放率 <div class="sort-container" id="icon-ir"><div class="tri-up"></div><div class="tri-down"></div></div>
                        </th>
                        <th class="sticky-header px-3 py-3 text-left whitespace-nowrap sortable" onclick="setSort('hr')" onmouseenter="showTip(event, this)" onmousemove="moveTip(event)" onmouseleave="hideTip()" data-tip="<b>近5年蓋牌率</b><br><span class='bg-red-100 text-red-700 px-1 font-bold'>淺紅底</span>：= 100%<br><span class='text-red-700 font-bold'>深紅字</span>：≥ 60%">
                            近5年蓋牌率 <div class="sort-container" id="icon-hr"><div class="tri-up"></div><div class="tri-down"></div></div>
                        </th>
                        <th class="sticky-header px-3 py-3 text-left whitespace-nowrap sortable" onclick="setSort('fr')" onmouseenter="showTip(event, this)" onmousemove="moveTip(event)" onmouseleave="hideTip()" data-tip="<b>近5年翻盤率</b><br><span class='text-green-600 font-bold'>綠字粗體</span>：曾有不發放轉發放紀錄">
                            近5年翻盤率 <div class="sort-container" id="icon-fr"><div class="tri-up"></div><div class="tri-down"></div></div>
                        </th>
                        <th class="sticky-header px-3 py-3 text-left whitespace-nowrap sortable" onclick="setSort('update_date')">
                            更新日期 <div class="sort-container" id="icon-update_date"><div class="tri-up"></div><div class="tri-down"></div></div>
                        </th>
                        <th class="sticky-header px-3 py-3 text-left min-w-[200px]">領取條件</th>
                        <th class="sticky-header px-3 py-3 text-center whitespace-nowrap sortable" onclick="setSort('meeting_type')">
                            性質 <div class="sort-container" id="icon-meeting_type"><div class="tri-up"></div><div class="tri-down"></div></div>
                        </th>
                    </tr>
                </thead>
                <tbody id="body-current" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>

    <div id="page-history" class="hidden">
        <div class="overflow-x-auto bg-white rounded-lg shadow border border-slate-200 max-h-[80vh]">
            <table class="min-w-max md:min-w-full divide-y divide-slate-200 text-sm">
                <thead class="bg-slate-100 text-slate-700 font-bold">
                    <tr>
                        <th class="sticky-header px-4 py-3 text-left whitespace-nowrap sortable" onclick="setSort('stock_id')">
                            代號 <div class="sort-container" id="icon-stock_id-hist"><div class="tri-up"></div><div class="tri-down"></div></div>
                        </th>
                        <th class="sticky-header px-4 py-3 text-left whitespace-nowrap">名稱</th>
                        <th class="sticky-header px-4 py-3 text-left whitespace-nowrap sortable" onclick="setSort('ir')" onmouseenter="showTip(event, this)" onmousemove="moveTip(event)" onmouseleave="hideTip()" data-tip="<b>近5年發放率</b><br><span class='bg-red-100 text-red-700 px-1 font-bold'>淺紅底</span>：≤ 40%<br><span class='text-red-700 font-bold'>深紅字</span>：≤ 60%">
                            近5年發放率 <div class="sort-container" id="icon-ir-hist"><div class="tri-up"></div><div class="tri-down"></div></div>
                        </th>
                        <th class="sticky-header px-4 py-3 text-left whitespace-nowrap sortable" onclick="setSort('hr')" onmouseenter="showTip(event, this)" onmousemove="moveTip(event)" onmouseleave="hideTip()" data-tip="<b>近5年蓋牌率</b><br><span class='bg-red-100 text-red-700 px-1 font-bold'>淺紅底</span>：= 100%<br><span class='text-red-700 font-bold'>深紅字</span>：≥ 60%">
                            近5年蓋牌率 <div class="sort-container" id="icon-hr-hist"><div class="tri-up"></div><div class="tri-down"></div></div>
                        </th>
                        <th class="sticky-header px-4 py-3 text-left whitespace-nowrap sortable" onclick="setSort('fr')" onmouseenter="showTip(event, this)" onmousemove="moveTip(event)" onmouseleave="hideTip()" data-tip="<b>近5年翻盤率</b><br><span class='text-green-600 font-bold'>綠字粗體</span>：曾有不發放轉發放紀錄">
                            近5年翻盤率 <div class="sort-container" id="icon-fr-hist"><div class="tri-up"></div><div class="tri-down"></div></div>
                        </th>
                        <th class="sticky-header px-4 py-3 text-left min-w-[200px]">預設條件</th>
                        <th class="sticky-header px-4 py-3 text-left whitespace-nowrap">去年紀念品</th>
                    </tr>
                </thead>
                <tbody id="body-history" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>
</main>

<div id="global-tooltip"></div>

<script>
    let dbHistoryMap = {}, dbPage1 = [], dbHistoryList = [];
    let currentTab = 'current';
    const thisYear = new Date().getFullYear();
    const todayStr = new Date().toISOString().split('T')[0].replace(/-/g, '/');

    let sortState = {
        current: { key: 'update_date', asc: false },
        history: { key: 'stock_id', asc: true }
    };

    async function loadData() {
        try {
            const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
            const [rawHistory, rawPage1] = await Promise.all([
                fetch(`${basePath}/data/stock_history.json`).then(r => r.json()),
                fetch(`${basePath}/data/page1_data.json`).then(r => r.json())
            ]);

            rawHistory.forEach(row => {
                if (!dbHistoryMap[row.stock_id]) dbHistoryMap[row.stock_id] = {};
                dbHistoryMap[row.stock_id][row.year] = row;
            });

            dbPage1 = rawPage1.map(item => ({
                ...item,
                stats: calculateStats(dbHistoryMap[item.stock_id] || {})
            }));

            dbHistoryList = Object.keys(dbHistoryMap).map(sid => {
                const p1Match = rawPage1.find(p => p.stock_id === sid) || {};
                return {
                    stock_id: sid,
                    stock_name: p1Match.stock_name || '未知',
                    stats: calculateStats(dbHistoryMap[sid]),
                    history: dbHistoryMap[sid],
                    condition: p1Match.condition || ''
                };
            });

            renderData();
        } catch (e) { console.error("資料載入失敗:", e); }
    }

    function calculateStats(histDict) {
        let logs = [];
        let issues = 0, hides = 0, flips = 0;
        
        for (let i = 1; i <= 10; i++) {
            const y = thisYear - i;
            const rec = histDict[y.toString()];
            const s = rec?.status || "";
            logs.push(`(${y}) ${rec?.item || "未公告"}`);
            
            if (i <= 5 && rec) {
                if (s.includes("發放")) issues++;
                if (s.includes("待公布 -> 發放") || s.includes("待公布->發放")) hides++;
                if (s.includes("不發放 -> 發放") || s.includes("無資料 -> 發放")) flips++;
            }
        }
        return {
            irRaw: issues / 5, hrRaw: hides / 5, frRaw: flips / 5,
            irStr: Math.round((issues / 5) * 100) + '%',
            hrStr: Math.round((hides / 5) * 100) + '%',
            frStr: Math.round((flips / 5) * 100) + '%',
            logHTML: logs.join('<br>')
        };
    }

    function colorRate(raw, str, type) {
        if (type === 'flip') return raw > 0 ? `<span class="text-green-600 font-bold">${str}</span>` : str;
        if (type === 'issue') {
            if (raw <= 0.4) return `<span class="bg-[#fee2e2] text-red-700 font-bold px-1 rounded">${str}</span>`;
            if (raw <= 0.6) return `<span class="text-red-700 font-bold">${str}</span>`;
        }
        if (type === 'hide') {
            if (raw === 1.0) return `<span class="bg-[#fee2e2] text-red-700 font-bold px-1 rounded">${str}</span>`;
            if (raw >= 0.6) return `<span class="text-red-700 font-bold">${str}</span>`;
        }
        return str;
    }

    function setSort(key) {
        let s = sortState[currentTab];
        if (s.key === key) s.asc = !s.asc;
        else { s.key = key; s.asc = (key === 'stock_id'); }
        renderData();
    }

    function sortData(dataArray) {
        let s = sortState[currentTab];
        return dataArray.sort((a, b) => {
            let valA, valB;
            switch(s.key) {
                case 'stock_id': valA = a.stock_id; valB = b.stock_id; break;
                case 'price': 
                    valA = parseFloat(String(a.price || '0').replace(/,/g, '')) || 0;
                    valB = parseFloat(String(b.price || '0').replace(/,/g, '')) || 0;
                    break;
                case 'last_buy': valA = (a.last_buy || '').split(' ')[0]; valB = (b.last_buy || '').split(' ')[0]; break;
                case 'update_date': valA = a.update_date || '1970/01/01'; valB = b.update_date || '1970/01/01'; break;
                case 'ir': valA = a.stats.irRaw; valB = b.stats.irRaw; break;
                case 'hr': valA = a.stats.hrRaw; valB = b.stats.hrRaw; break;
                case 'fr': valA = a.stats.frRaw; valB = b.stats.frRaw; break;
                case 'meeting_type': valA = a.meeting_type; valB = b.meeting_type; break;
            }
            if (valA < valB) return s.asc ? -1 : 1;
            if (valA > valB) return s.asc ? 1 : -1;
            return 0;
        });
    }

    function renderData() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        
        document.querySelectorAll('.sortable').forEach(el => {
            el.classList.remove('active-sort', 'sort-asc', 'sort-desc');
        });

        let s = sortState[currentTab];
        let suffix = currentTab === 'history' ? '-hist' : '';
        let iconEl = document.getElementById(`icon-${s.key}${suffix}`);
        
        if (iconEl) {
            let th = iconEl.parentElement;
            th.classList.add('active-sort');
            th.classList.add(s.asc ? 'sort-asc' : 'sort-desc');
        }

        if (currentTab === 'current') {
            let data = dbPage1.filter(i => i.stock_id.includes(q) || i.stock_name.includes(q));
            data = sortData(data);
            document.getElementById('body-current').innerHTML = data.map(item => {
                const condText = item.condition || '';
                let tag = "";
                const hasSg = item.sg_item && item.sg_item !== "無" && item.sg_item !== "";
                const hasMops = item.mops_status === "發放" || item.mops_status === "不發放";
                if (hasSg && !hasMops) tag = `<span class="text-green-600 font-bold text-[10px] align-top ml-0.5" title="僅零股寶有資料">零</span>`;
                else if (!hasSg && hasMops) tag = `<span class="text-red-600 font-bold text-[10px] align-top ml-0.5" title="僅MOPS有公告">公</span>`;

                let buyClass = "whitespace-nowrap";
                if (!item.last_buy) buyClass += " bg-danger";
                else {
                    const cleanDate = item.last_buy.split(' ')[0];
                    if (cleanDate < todayStr) buyClass += " text-expired";
                }

                // 🌟 核心更新：資料衝突時顯示「零股寶 / MOPS」
                let displayItem = "待公布";
                if (hasMops && hasSg && item.mops_item !== item.sg_item) {
                    displayItem = `${item.sg_item} / ${item.mops_item}`;
                } else if (hasMops) {
                    displayItem = item.mops_item;
                } else if (hasSg) {
                    displayItem = item.sg_item;
                }

                if (item.needs_debug === 1) displayItem = `<span class="text-red-600 font-bold underline">查無詳細按鈕</span>`;

                // 顏色判定 Regex 依然完美相容「A / B」字串格式
                const isStrict = /身分|身份|證件|正本|不開放|委託/.test(condText);
                const isGift = /7-11|統一|全家|超商|商品卡|禮券|商品券/.test(displayItem);
                let souvenirBg = isStrict ? "bg-strict" : (isGift ? "bg-gift" : "");
                
                const meetTypeBadge = item.meeting_type.includes("臨時") 
                    ? `<span class="bg-orange-100 text-orange-700 px-1 rounded text-[10px] font-bold border border-orange-200">臨</span>`
                    : `<span class="text-slate-400 text-[10px]">常</span>`;

                return `
                <tr class="hover:bg-slate-50 transition border-b">
                    <td class="px-3 py-2 font-mono text-slate-700 whitespace-nowrap">${item.stock_id}${tag}</td>
                    <td class="px-3 py-2 font-bold text-slate-900 whitespace-nowrap">${item.stock_name}</td>
                    <td class="px-3 py-2 text-slate-600 whitespace-nowrap">${item.price || '-'}</td>
                    <td class="px-3 py-2 ${buyClass}">${item.last_buy || ''}</td>
                    <td class="px-3 py-2 ${souvenirBg} font-medium text-slate-800 cursor-help whitespace-nowrap" onmouseenter="showTip(event, this)" onmousemove="moveTip(event)" onmouseleave="hideTip()" data-tip='<span class="text-blue-300 font-bold">(${item.stock_id})${item.stock_name}</span><br><span class="text-xs text-gray-300">【近10年紀錄】</span><br>${item.stats.logHTML}'>
                        ${displayItem}
                    </td>
                    <td class="px-3 py-2 whitespace-nowrap">${colorRate(item.stats.irRaw, item.stats.irStr, 'issue')}</td>
                    <td class="px-3 py-2 whitespace-nowrap">${colorRate(item.stats.hrRaw, item.stats.hrStr, 'hide')}</td>
                    <td class="px-3 py-2 whitespace-nowrap">${colorRate(item.stats.frRaw, item.stats.frStr, 'flip')}</td>
                    <td class="px-3 py-2 text-slate-900 text-xs whitespace-nowrap">${item.update_date || ''}</td>
                    <td class="px-3 py-2 text-xs text-slate-600 truncate max-w-[200px]" title="${condText}">${condText}</td>
                    <td class="px-3 py-2 text-center whitespace-nowrap">${meetTypeBadge}</td>
                </tr>`;
            }).join('');
        } else {
            let data = dbHistoryList.filter(i => i.stock_id.includes(q) || i.stock_name.includes(q));
            data = sortData(data);
            document.getElementById('body-history').innerHTML = data.map(item => {
                return `
                <tr class="hover:bg-slate-50 transition border-b cursor-help" onmouseenter="showTip(event, this)" onmousemove="moveTip(event)" onmouseleave="hideTip()" data-tip='<span class="text-blue-300 font-bold">(${item.stock_id})${item.stock_name}</span><br><span class="text-xs text-gray-300">【近10年紀錄】</span><br>${item.stats.logHTML}'>
                    <td class="px-4 py-3 font-mono text-slate-700 whitespace-nowrap">${item.stock_id}</td>
                    <td class="px-4 py-3 font-bold text-slate-900 whitespace-nowrap">${item.stock_name}</td>
                    <td class="px-4 py-3 whitespace-nowrap">${colorRate(item.stats.irRaw, item.stats.irStr, 'issue')}</td>
                    <td class="px-4 py-3 whitespace-nowrap">${colorRate(item.stats.hrRaw, item.stats.hrStr, 'hide')}</td>
                    <td class="px-4 py-3 whitespace-nowrap">${colorRate(item.stats.frRaw, item.stats.frStr, 'flip')}</td>
                    <td class="px-4 py-3 text-xs text-slate-700 truncate max-w-[200px]" title="${item.condition}">${item.condition}</td>
                    <td class="px-4 py-3 font-medium text-slate-800 whitespace-nowrap">
                        ${item.history?.[(thisYear - 1).toString()]?.item || '-'}
                    </td>
                </tr>`;
            }).join('');
        }
    }

    function switchTab(tab) {
        currentTab = tab;
        const actBtn = tab === 'current' ? 'tab-current' : 'tab-history';
        const inactBtn = tab === 'current' ? 'tab-history' : 'tab-current';
        document.getElementById(actBtn).className = "px-4 py-1.5 rounded-md text-sm font-bold bg-indigo-900 shadow-inner ring-1 ring-indigo-400 whitespace-nowrap";
        document.getElementById(inactBtn).className = "px-4 py-1.5 rounded-md text-sm font-medium hover:bg-indigo-600 transition whitespace-nowrap";
        document.getElementById('page-current').className = tab === 'current' ? 'block' : 'hidden';
        document.getElementById('page-history').className = tab === 'history' ? 'block' : 'hidden';
        renderData();
    }

    const tooltip = document.getElementById('global-tooltip');
    function showTip(e, el) { tooltip.innerHTML = el.getAttribute('data-tip'); tooltip.style.visibility = 'visible'; tooltip.style.opacity = '1'; moveTip(e); }
    function moveTip(e) {
        let x = e.clientX + 15, y = e.clientY + 15;
        if (x + tooltip.offsetWidth > window.innerWidth) x = e.clientX - tooltip.offsetWidth - 15;
        if (y + tooltip.offsetHeight > window.innerHeight) y = e.clientY - tooltip.offsetHeight - 15;
        tooltip.style.left = x + 'px'; tooltip.style.top = y + 'px';
    }
    function hideTip() { tooltip.style.opacity = '0'; tooltip.style.visibility = 'hidden'; }

    loadData();
</script>
</body>
</html>
