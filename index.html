<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股東會紀念品戰情室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 浮動視窗基礎設定 */
        .tooltip { position: relative; cursor: help; }
        .tooltip .tooltiptext {
            visibility: hidden; width: 220px; background-color: #1e293b; color: #f8fafc;
            text-align: left; border-radius: 6px; padding: 12px; position: absolute;
            z-index: 50; bottom: 125%; left: 50%; transform: translateX(-50%); opacity: 0;
            transition: opacity 0.2s; pointer-events: none; line-height: 1.6; font-size: 13px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); border: 1px solid #334155;
        }
        .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }
        
        /* 狀態顏色定義 */
        .bg-strict { background-color: #fca5a5 !important; } /* 紅底 (嚴格條件) */
        .bg-gift { background-color: #bbf7d0 !important; }   /* 綠底 (超商禮券) */
        .bg-missing { background-color: #fef08a !important; } /* 黃底 (空條件) */
        .bg-danger { background-color: #fee2e2 !important; } /* 淺紅底 (缺買進日) */
        .text-expired { color: #dc2626 !important; font-weight: bold; } /* 紅字粗體 (過期) */
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

<nav class="bg-indigo-800 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-[98%] mx-auto px-4">
        <div class="flex items-center justify-between h-14">
            <div class="flex items-center space-x-6">
                <span class="text-xl font-bold tracking-widest">紀念品戰情室</span>
                <div class="flex space-x-2">
                    <button onclick="switchTab('current')" id="tab-current" class="px-4 py-1.5 rounded-md text-sm font-bold bg-indigo-900 shadow-inner ring-1 ring-indigo-400">當下會議</button>
                    <button onclick="switchTab('history')" id="tab-history" class="px-4 py-1.5 rounded-md text-sm font-medium hover:bg-indigo-600 transition">歷史資料</button>
                </div>
            </div>
            <div class="flex-1 max-w-xs ml-4">
                <input type="text" id="searchInput" oninput="renderData()" placeholder="🔍 輸入代號或名稱..." class="w-full px-3 py-1.5 bg-indigo-900 border border-indigo-600 text-white placeholder-indigo-300 rounded focus:outline-none focus:ring-2 focus:ring-white text-sm">
            </div>
        </div>
    </div>
</nav>

<main class="max-w-[98%] mx-auto py-6">
    <!-- 當下會議 Page -->
    <div id="page-current" class="block">
        <div class="overflow-x-auto bg-white rounded-lg shadow border border-slate-200">
            <table class="min-w-full divide-y divide-slate-200 text-sm">
                <thead class="bg-slate-100 text-slate-700 font-bold">
                    <tr>
                        <th class="px-3 py-3 text-left">代號</th>
                        <th class="px-3 py-3 text-left whitespace-nowrap">名稱</th>
                        <th class="px-3 py-3 text-left">股價</th>
                        <th class="px-3 py-3 text-left whitespace-nowrap">最後買進日</th>
                        <th class="px-3 py-3 text-left w-1/5">紀念品</th>
                        <th class="px-3 py-3 text-left">5年發放率</th>
                        <th class="px-3 py-3 text-left">5年蓋牌率</th>
                        <th class="px-3 py-3 text-left">5年翻盤率</th>
                        <th class="px-3 py-3 text-left whitespace-nowrap">更新日期</th>
                        <th class="px-3 py-3 text-left w-1/5">條件</th>
                        <th class="px-3 py-3 text-left whitespace-nowrap">性質</th>
                    </tr>
                </thead>
                <tbody id="body-current" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>

    <!-- 歷史資料 Page -->
    <div id="page-history" class="hidden">
        <div class="overflow-x-auto bg-white rounded-lg shadow border border-slate-200">
            <table class="min-w-full divide-y divide-slate-200 text-sm">
                <thead class="bg-slate-100 text-slate-700 font-bold">
                    <tr>
                        <th class="px-4 py-3 text-left">代號</th>
                        <th class="px-4 py-3 text-left">名稱</th>
                        <th class="px-4 py-3 text-left">近五年發放率</th>
                        <th class="px-4 py-3 text-left">近五年蓋牌率</th>
                        <th class="px-4 py-3 text-left">近五年翻盤率</th>
                        <th class="px-4 py-3 text-left w-1/3">條件</th>
                        <th class="px-4 py-3 text-left">上次紀念品</th>
                    </tr>
                </thead>
                <tbody id="body-history" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>
</main>

<script>
    let dbHistory = [], dbPage1 = [];
    let currentTab = 'current';
    const thisYear = new Date().getFullYear(); // 基準年 (例如 2026)

    async function loadData() {
        try {
            // 使用相對路徑確保 GitHub Pages 讀取正常
            const [resH, resP1] = await Promise.all([
                fetch('./data/db_history.json').then(r => r.json()),
                fetch('./data/db_page1.json').then(r => r.json())
            ]);
            dbHistory = resH;
            dbPage1 = resP1;
            renderData();
        } catch (e) {
            console.error("資料載入失敗:", e);
        }
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('page-current').className = tab === 'current' ? 'block' : 'hidden';
        document.getElementById('page-history').className = tab === 'history' ? 'block' : 'hidden';
        
        // 按鈕視覺切換
        const actClass = "px-4 py-1.5 rounded-md text-sm font-bold bg-indigo-900 shadow-inner ring-1 ring-indigo-400";
        const inactClass = "px-4 py-1.5 rounded-md text-sm font-medium hover:bg-indigo-600 transition";
        document.getElementById('tab-current').className = tab === 'current' ? actClass : inactClass;
        document.getElementById('tab-history').className = tab === 'history' ? actClass : inactClass;
        
        renderData();
    }

    // 計算 5年/10年 的機率與歷史軌跡
    function getStats(sid, isTenYears = false) {
        const h = dbHistory.find(x => x.stock_id === sid);
        let logs = [];
        let issues = 0, hides = 0, flips = 0;
        
        const loopYears = isTenYears ? 10 : 5;
        
        for (let i = 1; i <= loopYears; i++) {
            const y = thisYear - i; // 過去年份 (如 2025, 2024...)
            const rec = h?.history?.[y.toString()];
            const s = rec?.status || "";
            const item = rec?.item || "未公告";
            
            // 處理 10 年軌跡特例：2016 無資料
            if (isTenYears && y === 2016 && !rec) {
                logs.push(`<span class="text-red-500 font-bold">(2016)無資料</span>`);
            } else {
                logs.push(`(${y})${item}`);
            }

            // 機率僅計算近 5 年
            if (i <= 5) {
                if (s.includes("發放")) issues++;
                if (s.includes("待公布->發放") || s.includes("待公布 -> 發放")) hides++;
                if (s.includes("不發放->發放") || s.includes("不發放 -> 發放")) flips++;
            }
        }
        
        return {
            ir: Math.round((issues / 5) * 100) + '%',
            hr: Math.round((hides / 5) * 100) + '%',
            fr: Math.round((flips / 5) * 100) + '%',
            logHTML: logs.join('<br>')
        };
    }

    function renderData() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        
        if (currentTab === 'current') {
            // 當下會議：搜尋過濾 + 更新日期由近到遠排序
            const data = dbPage1.filter(i => i.stock_id.includes(q) || i.stock_name.includes(q))
                                .sort((a, b) => new Date(b.update_date || '1970/01/01') - new Date(a.update_date || '1970/01/01'));
            
            const todayStr = new Date().toISOString().split('T')[0].replace(/-/g, '/');

            document.getElementById('body-current').innerHTML = data.map(item => {
                const stats = getStats(item.stock_id, false); // 5年軌跡
                const condText = item.condition || '';
                
                // --- 來源標註邏輯 (零 / 公) ---
                const hasSG = item.sg_item && item.sg_item !== '無';
                const hasMOPS = item.mops_item && item.mops_item !== '無';
                let tag = "";
                if (hasSG && !hasMOPS) tag = `<span class="text-green-600 font-bold text-[10px] align-top ml-0.5">零</span>`;
                else if (hasMOPS && !hasSG) tag = `<span class="text-red-600 font-bold text-[10px] align-top ml-0.5">公</span>`;

                // --- 買進日邏輯 ---
                let buyClass = "";
                if (!item.last_buy) buyClass = "bg-danger";
                else if (item.last_buy < todayStr) buyClass = "text-expired";

                // --- 紀念品顯示邏輯 ---
                let displayItem = "";
                if (item.sg_item === item.mops_item) {
                    displayItem = item.sg_item || '未公告';
                } else {
                    displayItem = `[${item.sg_item || '無'}] / [${item.mops_item || '無'}]`;
                }
                if (item.needs_debug) displayItem = `<span class="text-red-600 font-bold underline">查無詳細公告(需確認)</span>`;

                // --- 背景顏色邏輯 ---
                const isStrict = /身分|身份|證件|正本|不開放|委託/.test(condText);
                const isGift = /7-11|統一|全家|超商|商品卡|商品券|禮物卡|禮券|即享/.test(displayItem) && !/咖啡|美式/.test(displayItem);
                
                let souvenirBg = "";
                if (isStrict) souvenirBg = "bg-strict"; // 最高權限紅底
                else if (isGift) souvenirBg = "bg-gift"; // 綠底
                
                return `
                <tr class="hover:bg-slate-50 transition ${item.needs_debug ? 'bg-red-50' : ''}">
                    <td class="px-3 py-2 font-mono text-slate-700">${item.stock_id}${tag}</td>
                    <td class="px-3 py-2 font-bold text-slate-900">${item.stock_name}</td>
                    <td class="px-3 py-2 text-slate-600">${item.price || '-'}</td>
                    <td class="px-3 py-2 ${buyClass}">${item.last_buy || ''}</td>
                    <td class="px-3 py-2 ${souvenirBg} tooltip font-medium text-slate-800">
                        ${displayItem}
                        <div class="tooltiptext">
                            <span class="text-red-400 font-bold">(${item.stock_id})${item.stock_name}</span><br>
                            ${stats.logHTML}
                        </div>
                    </td>
                    <td class="px-3 py-2 text-slate-600">${stats.ir}</td>
                    <td class="px-3 py-2 text-slate-600">${stats.hr}</td>
                    <td class="px-3 py-2 text-slate-600">${stats.fr}</td>
                    <td class="px-3 py-2 text-slate-400 text-xs">${item.update_date || ''}</td>
                    <td class="px-3 py-2 text-xs text-slate-600 truncate max-w-[200px]" title="${condText}">${condText}</td>
                    <td class="px-3 py-2 font-semibold text-slate-700">${item.meeting_type}</td>
                </tr>`;
            }).join('');
            
        } else {
            // 歷史資料：搜尋過濾 + 代號由小到大排序
            const data = dbHistory.filter(i => i.stock_id.includes(q) || i.stock_name.includes(q))
                                  .sort((a, b) => a.stock_id.localeCompare(b.stock_id));

            // 需要找出最新的「上次紀念品」與「條件」(從 dbPage1 抓取最新的 condition)
            const lastYear = (thisYear - 1).toString();

            document.getElementById('body-history').innerHTML = data.map(item => {
                const stats = getStats(item.stock_id, true); // 10年軌跡
                
                // 從 dbPage1 取得該代號的常會條件 (若無則空)
                const p1Match = dbPage1.find(p => p.stock_id === item.stock_id && p.meeting_type === "常會");
                const condText = p1Match ? p1Match.condition : '';
                
                // 條件背景色邏輯
                const isStrict = /身分|身份|證件|正本|不開放|委託/.test(condText);
                let condBg = "";
                if (isStrict) condBg = "bg-strict";
                else if (!condText) condBg = "bg-missing";

                // 上次紀念品
                const lastItem = item.history?.[lastYear]?.item || '-';

                return `
                <tr class="hover:bg-slate-50 transition">
                    <td class="px-4 py-2 font-mono text-slate-700">${item.stock_id}</td>
                    <td class="px-4 py-2 font-bold text-slate-900">${item.stock_name}</td>
                    <td class="px-4 py-2 text-slate-600">${stats.ir}</td>
                    <td class="px-4 py-2 text-slate-600">${stats.hr}</td>
                    <td class="px-4 py-2 text-slate-600">${stats.fr}</td>
                    <td class="px-4 py-2 text-xs text-slate-700 ${condBg}">${condText}</td>
                    <td class="px-4 py-2 tooltip font-medium text-slate-800">
                        ${lastItem}
                        <div class="tooltiptext">
                            <span class="text-red-400 font-bold">(${item.stock_id})${item.stock_name}</span><br>
                            ${stats.logHTML}
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }
    }

    // 初始化啟動
    loadData();
</script>
</body>
</html>
