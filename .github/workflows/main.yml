name: 每日股東會紀念品更新 (Daily Updater)

on:
  schedule:
    - cron: '0 16 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    # 🌟 解除 Warning：強制 GitHub Actions 使用最新的 Node.js 24
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: 📥 抓取最新程式碼 (Checkout Repo)
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🐍 設定 Python 環境
      # 🌟 解除 Warning：升級到 v5 最新版
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 安裝依賴套件 (Install Dependencies)
      run: |
        python -m pip install --upgrade pip
        pip install aiohttp beautifulsoup4 tenacity

    - name: 🤖 執行每日更新爬蟲 (Run Daily Updater)
      run: |
        # 🌟 解決 Error：確保這裡是您真正的檔案名稱！
        python daily_updater.py

    - name: 📤 提交並推播變更 (Commit and Push)
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🤖 自動更新：MOPS 異動與零股寶條件 (SQLite)"
        file_pattern: "data/mops_data.db data/stock_history.json data/page1_data.json"
        skip_dirty_check: false
