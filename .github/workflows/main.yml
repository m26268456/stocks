name: 每日股東會紀念品更新 (Daily Updater)

on:
  schedule:
    # cron 語法：分鐘 小時 日 月 星期 (使用 UTC 時間)
    # 台灣時間 (UTC+8) 的 00:00，就是 UTC 的前一天 16:00
    - cron: '0 16 * * *' 
  # 允許你隨時在 GitHub 網頁上手動點擊 "Run workflow" 按鈕測試
  workflow_dispatch:

# 【新增】給予 GitHub Actions 寫入權限，否則無法 Commit 回 Repo
permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 抓取最新程式碼 (Checkout Repo)
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🐍 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 安裝依賴套件 (Install Dependencies)
      run: |
        python -m pip install --upgrade pip
        # 移除了不必要的 pandas 等套件，加快執行速度
        pip install beautifulsoup4 playwright
        playwright install chromium

    - name: 🤖 執行每日更新爬蟲 (Run Daily Updater)
      run: |
        python daily_updater.py

    - name: 📤 提交並推播變更 (Commit and Push)
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🤖 自動更新：MOPS 異動與零股寶條件"
        # 【關鍵修改】改成 data/ 目錄，並且加上 db_page1.json
        file_pattern: "data/db_history.json data/db_page1.json data/state_mops_dates.json"
        skip_dirty_check: false
