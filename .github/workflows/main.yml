name: 每日股東會紀念品更新 (Daily Updater)

on:
  schedule:
    # cron 語法：分鐘 小時 日 月 星期 (使用 UTC 時間)
    # 台灣時間 (UTC+8) 的 00:00，就是 UTC 的前一天 16:00
    - cron: '0 16 * * *' 
  # 允許你隨時在 GitHub 網頁上手動點擊 "Run workflow" 按鈕測試
  workflow_dispatch:

# 給予 GitHub Actions 寫入權限，否則無法 Commit 回 Repo
permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 抓取最新程式碼 (Checkout Repo)
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🐍 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 安裝依賴套件 (Install Dependencies)
      run: |
        python -m pip install --upgrade pip
        # 🌟 拔除笨重的 Playwright，改裝最新的 API 爬蟲套件
        pip install aiohttp beautifulsoup4 tenacity

    - name: 🤖 執行每日更新爬蟲 (Run Daily Updater)
      run: |
        # ⚠️ 請確認這裡的檔名與您 Repo 中的 Python 檔案名稱一致
        python daily_updater.py

    - name: 📤 提交並推播變更 (Commit and Push)
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🤖 自動更新：MOPS 異動與零股寶條件 (SQLite)"
        # 🌟 關鍵修改：必須推播 SQLite 資料庫 (.db) 以及兩份新的 JSON 檔案
        file_pattern: "data/mops_data.db data/stock_history.json data/page1_data.json"
        skip_dirty_check: false
